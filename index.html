<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Player Trivia Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Screen 1: Player Setup -->
        <div id="setup-screen" class="screen">
            <h1>Trivia Battle</h1>
            <div class="input-group">
                <label for="player1-name">Player 1 Name:</label>
                <input type="text" id="player1-name" placeholder="Enter name">
            </div>
            <div class="input-group">
                <label for="player2-name">Player 2 Name:</label>
                <input type="text" id="player2-name" placeholder="Enter name">
            </div>
            <button id="start-game-btn">Start Game</button>
            <p id="setup-error" class="error-msg"></p>
        </div>

        <!-- Screen 2: Category Selection -->
        <div id="category-screen" class="screen" style="display: none;">
            <h2 id="round-title">Round 1</h2>
            <div class="input-group">
                <label for="category-select">Select Category:</label>
                <select id="category-select"></select>
            </div>
            <button id="start-round-btn">Start Round</button>
        </div>

        <!-- Screen 3: Question Gameplay -->
        <div id="gameplay-screen" class="screen" style="display: none;">
            <div class="game-header">
                <span id="gameplay-round">Round 1</span> | 
                <span id="gameplay-category">Category</span> | 
                <span id="gameplay-difficulty">Easy</span>
            </div>
            <div class="turn-indicator">
                <h3 id="current-turn">Player 1's Turn</h3>
            </div>
            <div class="scoreboard">
                <p><span id="p1-display">Player 1</span>: <span id="p1-score">0</span></p>
                <p><span id="p2-display">Player 2</span>: <span id="p2-score">0</span></p>
            </div>
            <div id="question-container">
                <p id="question-text"> <!-- Question will be injected here -->  </p> 
                <div id="options-container">
                    <!-- Options will be injected here -->
                </div>
            </div>
            <div id="feedback-msg"></div>
            <button id="next-btn" disabled>Next</button>
        </div>

        <!-- Screen 4: Round Summary & Decision -->
        <div id="summary-screen" class="screen" style="display: none;">
            <h2>Round Summary</h2>
            <div class="summary-actions">
                <button id="next-round-btn">Next Round</button>
                <button id="end-game-btn">End Game</button>
            </div>
        </div>

        <!-- Screen 5: Final Result -->
        <div id="result-screen" class="screen" style="display: none;">
            <h2>Final Result</h2>
            <div id="final-scores">
                <p><span id="final-p1-name">Player 1</span>: <span id="final-p1-score">0</span></p>
                <p><span id="final-p2-name">Player 2</span>: <span id="final-p2-score">0</span></p>
            </div>
            <h1 id="winner-declaration">Winner: Player 1!</h1>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
